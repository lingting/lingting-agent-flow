# AgentFlow 示例配置
#
# 用法：
#   ./bin/agentflow config validate --config configs/example.yaml
#
# 未显式指定 --config 时，命令读取 configs/agentflow.yaml。
# 模型值为占位符，不代表已验证的模型名称，需要替换为本机 Pi 已配置的模型。

app:
  name: agentflow
  # 可选 debug、info、warn、error
  log_level: info

# 统一服务入口（agentflow server）的监听与关闭设置。
#
# 默认只监听回环地址：Web 页面与 API 同源，未实现远程访问认证前不对外开放网卡。
# port 省略时使用 26380；--address 参数优先于这里的配置。
server:
  host: 127.0.0.1
  port: 26380
  # 优雅关闭的最长等待秒数，0 表示使用默认值 10 秒
  shutdown_timeout_seconds: 0

storage:
  database_path: .agentflow/agentflow.db

workspace:
  worktree_root: .agentflow/worktrees

scheduler:
  # 必须大于 0
  max_concurrent_tasks: 3
  # 不得为负数，0 表示步骤失败后不自动重试
  max_retries_per_step: 3

# SSH 连接层配置。
#
# 这里只配置路径与超时，不保存任何凭据：密码与私钥口令只能在连接时于内存中提供，
# 私钥只在机器配置中保存本机文件路径。
# 主机密钥校验不可关闭，未知主机必须核验指纹后显式信任。
ssh:
  # 只读 known_hosts 文件；留空时复用本机用户 OpenSSH 的 known_hosts。
  # AgentFlow 不写 known_hosts：信任新主机需由用户用 OpenSSH 追加已核验的密钥。
  known_hosts_path: ""
  # TCP 连接与 SSH 认证的超时秒数，0 表示使用默认值
  connect_timeout_seconds: 0

# 角色名称可自由命名，工作流只依据 type 识别职责。
# type 只能取 planner、developer、validator。
# tools_policy.mode 与 type 一一对应：
#   planner -> read_only
#   developer -> development
#   validator -> verification
# 第一版只校验声明，不据此实施实际权限控制。
roles:
  - id: planner
    name: 架构规划师
    type: planner
    runner: pi
    model: "provider/model-id"
    system_prompt: |
      分析需求并生成结构化开发计划。
    tools_policy:
      mode: read_only

  - id: developer
    name: 开发工程师
    type: developer
    runner: pi
    model: "provider/model-id"
    system_prompt: |
      按照指定开发步骤实现代码。
    tools_policy:
      mode: development

  - id: validator
    name: 验证工程师
    type: validator
    runner: pi
    model: "provider/model-id"
    system_prompt: |
      根据验收标准验证代码，并输出结构化验证结果。
    tools_policy:
      mode: verification
