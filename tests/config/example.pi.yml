# 使用方式：复制当前文件为 tests/config/pi.yml，然后按需修改内容。
#
# 该文件提供需要真实 Pi CLI 的测试（tests/integration/pi、
# tests/integration/remote/agent、tests/integration/remote/workflow）所使用的配置。
#
# 取值支持 ${NAME} 占位符：解析配置时会查找同名环境变量，存在则替换为它的值，
# 不存在则保留原样 ${NAME}。
#
# 真实配置文件不入库，只提交本示例文件。

pi:
  # 真实调用使用的模型标识，留空时使用默认免费模型 group/free。
  # 每次调用都会显式传入模型，不回退到 Pi CLI 配置中的默认模型。
  model: group/free
  # Pi 可执行文件路径，留空时使用 PATH 中的 pi。
  executable: ""
