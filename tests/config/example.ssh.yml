# 使用方式：复制当前文件为 tests/config/ssh.yml，然后按需修改内容。
#
# 该文件提供需要真实远程 Linux 机器的测试（tests/integration/ssh、
# tests/integration/remote/*）所使用的 SSH 目标配置。
#
# 取值支持 ${NAME} 占位符：解析配置时会查找同名环境变量，存在则替换为它的值，
# 不存在则保留原样 ${NAME}。
#
# 真实配置文件不入库，只提交本示例文件。

ssh:
  # 是否执行需要真实远程机器的测试（tests/integration/ssh、tests/integration/remote/*），
  # 默认 false。远程 Docker 用例还要求 docker.yml 中的 docker.remote_enabled 为 true。
  enable: false
  # SSH 服务器地址，必填。缺失时相关测试输出 WARN 并跳过。
  host: 10.0.0.10
  # 登录用户名，必填。
  user: deploy
  # SSH 端口，省略或为 0 时使用 22。
  port: 22
  # 私钥路径。本版本只支持私钥认证，缺失时连接类测试直接失败。
  # 支持 ${HOME} 这类占位符。
  private_key_path: ${HOME}/.ssh/id_ed25519
  # 参与主机密钥校验的只读 known_hosts 文件列表。
  # 留空表示复用本机 OpenSSH 的 ~/.ssh/known_hosts 与 known_hosts2。
  # 填写后文件必须可读，否则测试直接失败。
  known_hosts: []
