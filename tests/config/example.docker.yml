# 使用方式：复制当前文件为 tests/config/docker.yml，然后按需修改内容。
#
# 该文件提供需要真实远程 Docker 的测试（tests/integration/remote/*）所使用的配置。
# SSH 目标本身在 ssh.yml 中配置。
#
# 取值支持 ${NAME} 占位符：解析配置时会查找同名环境变量，存在则替换为它的值，
# 不存在则保留原样 ${NAME}。例如 api_key: ${AGENTFLOW_TEST_PI_API_KEY}。
#
# 真实配置文件不入库，只提交本示例文件。

docker:
  # 是否允许测试操作真实远程 Docker。
  # 只有为 true 时才连接远程 Docker；否则相关测试输出 WARN 并跳过。
  remote_enabled: false
  # tests/integration/remote/agent 使用的镜像引用。
  # 留空时使用默认镜像 agentflow-test-agent:1.0.0，远端缺失时按该目录下的
  # Dockerfile 构建。
  agent_image: agentflow-test-agent:1.0.0
  # tests/integration/remote/codesaver 使用的任务镜像引用，必须填写。
  git_image: ""

  # 可选：容器内 Pi 的模型接入配置。
  #
  # 填写齐全时，真实远程测试会直接覆盖容器内 Pi 自己的配置目录
  # （容器内 $HOME/.pi/agent，与 Pi 默认的 agent 目录一致）下的 models.json 与
  # settings.json，使容器内 Pi 通过这里给出的接入点、密钥、模型与思考等级执行真实
  # 调用；这两个文件只存在于容器内部文件系统，不写入项目代码目录、不写入远程项目
  # 配置目录，也不挂载宿主机目录。此时 docker.pi.model 优先于 pi.yml 中的 pi.model。
  #
  # base_url、api_key、model 三项都留空表示不使用该配置，容器内 Pi 沿用镜像内
  # 已有的配置。只填写了一部分时，相关用例输出 WARN 并跳过并指明缺少的项。
  #
  # api_key 属于凭据：它只会被写入容器内 Pi 的配置文件，不会出现在日志或数据库里；
  # 建议通过 ${NAME} 引用环境变量，避免把密钥写进本地配置文件。
  pi:
    # 模型接入点地址，需为 OpenAI 兼容接口，必填。
    base_url: https://api.example.com/v1
    # 接入点密钥，必填。
    api_key: ${AGENTFLOW_TEST_PI_API_KEY}
    # 容器内 Pi 使用的模型标识，必填。
    model: example-model
    # 思考等级，可选：off / minimal / low / medium / high / xhigh / max。
    # 留空时不显式指定，使用 Pi 的默认值。
    thinking_level: medium
    # provider 使用的接口协议，可选，默认 openai-completions。
    api: openai-completions
    # 写入 models.json 的 provider 名称，可选，默认 agentflow-test。
    provider: agentflow-test
