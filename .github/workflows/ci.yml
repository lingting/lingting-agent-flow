# AgentFlow 持续集成门禁（V3 R8）。
#
# 必需 Job（任一非成功，ci-summary 一律失败，不会把门禁报告为通过）：
# - go-static        ：Go 格式、静态检查与编译，最先失败以获得最快反馈
# - go-inventory     ：测试分组核验（go test 包与已注册 Case 分组）与覆盖对账，两步都是
#                      静态核对，不执行任何用例
# - go-unit          ：`./tests/unit/...`，仍由 `go test` 执行
# - cases-local      ：本机集成用例（统一执行器，`integration-local-*`）
# - cases-e2e        ：CLI 端到端用例（统一执行器，`e2e-cli`）
# - cases-selfcheck  ：执行器自检用例（`selfcheck` / `resourcecheck` / `concurrencycheck` / `pilot`）；
#                       pilot 需要被测服务二进制，Job 里先 `make build`
# - ui-test          ：前端用例（统一执行器，`frontend`）与格式、lint、类型检查、生产构建门禁
#
# 集成、E2E 与前端用例只有 `agentflow-test` 一个执行器；本地入口与这些 Job 一一对应：
# `make test-unit`、`make test-cases`（`TEST_KIND` 取 local / e2e / selfcheck / frontend）。
# 分组归属、选择条件与 Makefile 入口只定义在 `.github/scripts/go-test-groups.sh`，YAML 只传
# kind 与产物目录；分组遗漏、Case 分组未归类、声明落空或与工作流 / Makefile 漂移时
# go-inventory 失败，后续测试 Job 被跳过，ci-summary 因此不会把门禁报告为通过。
#
# 并发：每个 Job 独享一台 4 vCPU Runner，因此分组内部只开 `--parallel 4`，不在同一台机器上
# 叠加多个高并发测试进程。故障注入分组（`*-fault`）按设计注入失败并以非零退出码结束，
# 不进绿色门禁，需要时按 R2/R3 记录的逐条命令单独执行。
#
# 真实外部依赖测试（真实 SSH 设备、真实远程 Docker、容器内真实 Pi、真实远程 Git）与普通
# CI 分成两层，互不重叠：
# - 普通 CI 的必需 Job 一律以 `--real-tests off` 运行，不读取任何真实设备凭据，也不会
#   选中真实分组；未执行的用例不会被当成通过。
# - real-tests 只在真实测试授权判断通过后运行，只执行 real 分组，不重复执行普通用例。
#
# 真实测试授权由唯一的用户变量 AGENTFLOW_REAL_TESTS 控制（self / collaborator / all；
# 未设置、为空或取值未知时关闭）。判定规则集中在 internal/cigate，由
# cmd/agentflow-ci 执行：工作流里不写授权决策，也不在判定过程中检出或执行被提交的代码
# （判定 Job 检出的是 PR 的基础提交或本次运行的提交）。
#
# 凭据边界：真实测试的连接配置只来自 real-tests 环境的 Environment Secrets，由执行器的
# `--prepare-real-config` 现场渲染成被 .gitignore 忽略的 tests/config/*.yml；普通 CI 与授权
# 判断 Job 都不读取 Secret；pull_request 事件不会把真实设备凭据交给 fork PR，缺少 Secret 时
# real-tests 明确报告 SKIP 而不是失败或伪造通过。
#
# 产物：每个 Case Job 的产物只在 `<workspace>/.test-artifacts/<job>/<run-id>/` 下（统一报告
# report.json、用例日志与 cases 子目录），测试工作空间仍落在系统临时目录，因此上传的产物里
# 没有数据库、Session 或私钥。只有失败时才上传，避免占用存储。
#
# 缓存：Go 环境统一由 actions/setup-go 的 `cache: true` 缓存，它同时缓存 Go Module 下载
# 缓存（GOMODCACHE）与编译 / 测试包缓存（GOCACHE）。缓存键由 setup-go 生成，包含实际安装
# 的 Go 版本、Runner 操作系统与镜像、架构以及 `go.mod` + `go.sum` 的内容哈希，因此不同
# Go 版本与不同操作系统不会错误共享缓存，依赖变更会自动失效；未命中时按普通构建继续，
# 缓存损坏只会退化为重新编译。缓存里只有依赖与编译产物，不含测试数据库、Session、测试
# 工作空间、真实测试凭据或任何用户配置。
#
# 所有 Action 都用提交 SHA 固定（不用可移动的 tag），避免上游重新指向标签时 CI 行为变化。
#
# 本工作流同时提供给 publish.yml 复用（workflow_call）：正式 Release 必须以同一次运行
# 里通过的 CI 门禁为前提，而不是"标签提交早先碰巧在 master 上通过过"。workflow_call
# 不参与真实测试身份判定，因此复用运行时 real-tests 一律跳过。
#
# 具体执行逻辑在 .github/scripts/ 下：本文件只负责触发条件、Job、权限、依赖与脚本调用，
# 每个脚本的参数都在对应步骤里显式传入（参数与退出码契约见 .github/scripts/README.md）。
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:

# 最小权限：所有 Job 只读取仓库内容，不使用 Secret、不写入仓库、不需要额外作用域。
permissions:
  contents: read

# 同一 PR 的旧运行在新提交到达后取消；push 与手动触发不取消，避免丢失主分支门禁证据。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # 测试产物根目录固定在工作区内：执行器把每次运行写进 <根目录>/<job>/<run-id>/，
  # upload-artifact 因此能取到统一报告与用例日志。测试工作空间仍由执行器放在系统临时
  # 目录，依赖安装等步骤不使用该目录。
  TEST_ARTIFACT_ROOT: ${{ github.workspace }}/.test-artifacts

jobs:
  go-static:
    name: Go 格式与静态检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      static: ${{ steps.static.outcome }}
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      - name: 格式、静态检查与编译
        id: static
        run: bash .github/scripts/check-go-static.sh

  # 测试分组核验与覆盖对账都是静态门禁：普通测试 Job 全部依赖本 Job。分组遗漏、Case 分组
  # 未归类、声明落空、分组已定义却没有 Job 执行、Makefile 入口与分组清单不一致时本 Job 失败；
  # 覆盖对账只读 R0 冻结清单与用例注册表，发现缺失条目或多出注册时同样失败。
  go-inventory:
    name: 测试分组核验与覆盖对账
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      groups: ${{ steps.groups.outcome }}
      coverage: ${{ steps.coverage.outcome }}
      package_total: ${{ steps.groups.outputs.package_total }}
      case_total: ${{ steps.groups.outputs.case_total }}
      groups_markdown: ${{ steps.groups.outputs.groups_markdown }}
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      # 声明的普通分组与 Case kind 必须与清单一致：新增分组却没有对应 Job 同样算遗漏。
      - name: 核验测试分组覆盖
        id: groups
        run: bash .github/scripts/go-test-groups.sh --check --declared-groups unit --declared-case-kinds local,e2e,selfcheck,frontend
      # 覆盖对账只读冻结清单与注册表：缺失条目、无法解释的多余注册与结构性问题都让门禁失败；
      # 显式声明 dropped 的条目按理由通过（R5 §4.1）。
      - name: 覆盖对账（静态，不执行用例）
        id: coverage
        run: |
          go run ./cmd/agentflow-test --audit-coverage --audit-stage R5,R6 --audit-json "$TEST_ARTIFACT_ROOT/coverage/audit.json"
      - name: 上传覆盖对账结果
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/.test-artifacts/coverage
          if-no-files-found: warn
          retention-days: 7

  go-unit:
    name: Go 单元测试
    needs: [go-inventory]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tests: ${{ steps.tests.outcome }}
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      # tests/unit 仍由 go test 执行：它的跳过统计来自 go test 的顶层结论行，
      # 集成与 E2E 用例的跳过统计来自 report.json，两者口径都写进 Job 摘要。
      - name: 执行 Go 单元测试
        id: tests
        run: bash .github/scripts/run-go-group-tests.sh --group unit --artifact-dir "$TEST_ARTIFACT_ROOT/unit" --parallel 4
      # 失败时上传诊断产物：只有控制台输出与摘要，不含测试工作空间里的数据库、Session 与临时私钥。
      - name: 上传单元测试日志
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-unit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ github.workspace }}/.test-artifacts/unit/*-output.log
            ${{ github.workspace }}/.test-artifacts/unit/*-summary.txt
          if-no-files-found: warn
          retention-days: 7

  # 本机集成用例：integration-local-* 全部经由统一执行器执行，不触碰真实设备。
  cases-local:
    name: 本机集成用例
    needs: [go-inventory]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      tests: ${{ steps.cases.outcome }}
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      - name: 执行本机集成用例
        id: cases
        run: bash .github/scripts/run-cases.sh --kind local --artifact-dir "$TEST_ARTIFACT_ROOT/local" --parallel 4
      - name: 上传用例产物
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cases-local-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/.test-artifacts/local
          if-no-files-found: warn
          retention-days: 7

  # CLI 端到端用例：不需要 pnpm 与前端依赖。
  cases-e2e:
    name: CLI 端到端用例
    needs: [go-inventory]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      tests: ${{ steps.cases.outcome }}
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      - name: 执行 CLI 端到端用例
        id: cases
        run: bash .github/scripts/run-cases.sh --kind e2e --artifact-dir "$TEST_ARTIFACT_ROOT/e2e" --parallel 4
      - name: 上传用例产物
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cases-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/.test-artifacts/e2e
          if-no-files-found: warn
          retention-days: 7

  # 执行器自检用例：验证通过、跳过、失败、panic、超时、取消、迟到结果与零残留终检本身。
  cases-selfcheck:
    name: 执行器自检用例
    needs: [go-inventory]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tests: ${{ steps.cases.outcome }}
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      # 自检分组包含 pilot 试点用例：它把 <repo>/bin/agentflow 声明为 service-process 的可执行
      # 文件，缺失时资源分配失败并被记为 error（不是跳过）。因此本 Job 必须先构建被测二进制，
      # 与本地 `make test-cases TEST_KIND=selfcheck` 的前置保持一致。
      - name: 构建被测服务二进制
        run: make build
      # 显式核验路径与 pilot 的 serverBinaryPath() 一致：构建失败或产物路径漂移必须在这一步
      # 失败，不能延迟到 Case 的资源分配阶段才以"可执行文件不可用"暴露。
      - name: 核验被测服务二进制
        run: test -x bin/agentflow
      - name: 执行执行器自检用例
        id: cases
        run: bash .github/scripts/run-cases.sh --kind selfcheck --artifact-dir "$TEST_ARTIFACT_ROOT/selfcheck" --parallel 4
      - name: 上传用例产物
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cases-selfcheck-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/.test-artifacts/selfcheck
          if-no-files-found: warn
          retention-days: 7

  # 前端用例由统一执行器运行：dev server 由 frontend-dev-server 提供者启动，端口由 OS 分配；
  # 格式、lint、类型检查与生产构建属于非测试门禁，单独成步骤，不参与用例统计。
  ui-test:
    name: 前端用例与门禁
    needs: [go-inventory]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      prepare: ${{ steps.prepare.outcome }}
      tests: ${{ steps.tests.outcome }}
      gates: ${{ steps.gates.outcome }}
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      - name: 安装 pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.24.0"
      - name: 安装 Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: lingting-agent-flow-ui/package.json
          cache: pnpm
          cache-dependency-path: lingting-agent-flow-ui/pnpm-lock.yaml
      - name: 安装前端依赖
        id: prepare
        working-directory: lingting-agent-flow-ui
        run: pnpm install --frozen-lockfile
      - name: 安装 Chromium 与系统依赖
        working-directory: lingting-agent-flow-ui
        run: pnpm exec playwright install --with-deps chromium
      # 24 个 Playwright 文件与 13 个 Vitest 文件各是一条 Case，并发度由调度器决定。
      - name: 执行前端用例
        id: tests
        run: bash .github/scripts/run-cases.sh --kind frontend --artifact-dir "$TEST_ARTIFACT_ROOT/frontend" --parallel 4
      # vp fmt 与 vp lint --fix 会自动修改文件且不返回失败，因此必须在它们运行之后核验
      # 工作区是否仍有待修复改动；生产构建与产物校验留在同一步骤内。
      - name: 前端格式、lint、类型检查与生产构建
        id: gates
        run: |
          cd lingting-agent-flow-ui
          pnpm check
          pnpm build
          cd ..
          bash .github/scripts/check-frontend-clean.sh
          make web-verify
      # 失败时上传执行器产物（报告、用例日志、Playwright 报告与截图）；依赖目录与构建产物不上传。
      - name: 上传前端用例产物
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/.test-artifacts/frontend
          if-no-files-found: warn
          retention-days: 7

  # 真实测试授权判断：只读取仓库变量与 GitHub 事件上下文，不读取任何真实设备凭据，
  # 不建立网络连接（collaborator 模式下的 push 需要查询推送者权限，这是唯一的网络访问），
  # 也不执行被提交的代码。判定结论写入 Job 输出与摘要，供 real-tests 与 ci-summary 使用。
  real-tests-gate:
    name: 真实测试授权判断
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.gate.outputs.real_tests_enabled }}
      mode: ${{ steps.gate.outputs.mode }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      # 只检出可信提交：pull_request 事件检出基础分支提交，其他事件检出本次运行的提交。
      # 被提交的代码不参与授权判定，避免"PR 自己修改判定逻辑"绕过信任策略。
      - name: 检出可信的判定代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
      - name: 安装 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      - name: 判定真实测试资格
        id: gate
        env:
          # 唯一的用户配置变量：GitHub Repository Variable，未设置时为关闭状态。
          AGENTFLOW_REAL_TESTS: ${{ vars.AGENTFLOW_REAL_TESTS }}
          # 身份字段全部来自 GitHub 事件上下文；不使用 commit author 姓名或邮箱。
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          # 令牌只用于查询推送者的仓库权限（collaborator 模式 + push 事件），
          # 其他判定不发起任何网络访问；查不出权限时按拒绝处理（fail closed）。
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/check-real-test-authorization.sh

  # 真实外部依赖测试：只有授权判断通过后才运行，且只执行 real 分组。
  #
  # 保持单 Job 串行：真实 Pi、真实 SSH、真实远程 Docker / Agent / 代码保存 / 工作流共用
  # 同一台真实远程机器与同一个 Docker Engine，没有可证明的按套件资源隔离（容器虽有随机
  # 后缀，但 SSH 连接数、镜像构建与磁盘仍共享），因此并发度固定为 1。
  # 共用同一台设备的包内用例同样串行（用例声明 `Parallel: false`）：并行构建会把同一环境
  # 镜像标签改指到不同镜像，使先完成用例的"复用已有构建"核验失败。
  #
  # 连接配置只来自 real-tests 环境的 Environment Secrets（不是全仓库可读的
  # Repository Secrets）：普通 CI 拿不到这些凭据，fork PR 也拿不到。配置由执行器的
  # `--prepare-real-config` 现场渲染，缺少必需 Secret 时 configured=false，本 Job 的用例
  # 步骤被跳过并如实标注，未执行的用例不计为通过。
  real-tests:
    name: 真实外部依赖测试
    needs: [real-tests-gate]
    if: needs.real-tests-gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # 环境保护规则与凭据都挂在这个 Environment 上，而不是整个仓库。
    environment: real-tests
    permissions:
      contents: read
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      # 现场生成 tests/config/*.yml：这些文件被 .gitignore 忽略，不会被提交或上传。
      # 私钥与 known_hosts 写入 RUNNER_TEMP 下的临时目录，测试结束时随 Runner 销毁；
      # 配置内容与凭据值一律不打印（凭据行的 add-mask 由执行器输出），只报告"哪些文件已生成"。
      - name: 准备真实测试配置
        id: config
        env:
          REAL_SSH_HOST: ${{ secrets.REAL_SSH_HOST }}
          REAL_SSH_USER: ${{ secrets.REAL_SSH_USER }}
          REAL_SSH_PORT: ${{ secrets.REAL_SSH_PORT }}
          REAL_SSH_PRIVATE_KEY: ${{ secrets.REAL_SSH_PRIVATE_KEY }}
          REAL_SSH_KNOWN_HOSTS: ${{ secrets.REAL_SSH_KNOWN_HOSTS }}
          REAL_DOCKER_AGENT_IMAGE: ${{ secrets.REAL_DOCKER_AGENT_IMAGE }}
          REAL_DOCKER_GIT_IMAGE: ${{ secrets.REAL_DOCKER_GIT_IMAGE }}
          REAL_DOCKER_PI_BASE_URL: ${{ secrets.REAL_DOCKER_PI_BASE_URL }}
          REAL_DOCKER_PI_API_KEY: ${{ secrets.REAL_DOCKER_PI_API_KEY }}
          REAL_DOCKER_PI_MODEL: ${{ secrets.REAL_DOCKER_PI_MODEL }}
          REAL_DOCKER_PI_THINKING_LEVEL: ${{ secrets.REAL_DOCKER_PI_THINKING_LEVEL }}
          REAL_GIT_REPOSITORY: ${{ secrets.REAL_GIT_REPOSITORY }}
          REAL_GIT_SSH_KEY: ${{ secrets.REAL_GIT_SSH_KEY }}
          # REAL_PI_MODEL 只是可选的套件参数（模型标识），不参与授权判定：
          # 真实测试的信任范围始终只由 AGENTFLOW_REAL_TESTS 决定。留空时使用免费模型 group/free。
          REAL_PI_MODEL: ${{ vars.REAL_PI_MODEL }}
        run: go run ./cmd/agentflow-test --prepare-real-config
      - name: 真实外部依赖测试
        id: real
        if: steps.config.outputs.configured == 'true'
        env:
          # 授权标记由本工作流的授权判断 Job 产生，不是第二个用户可配置开关；
          # run-cases.sh 在缺失或非 true 时直接失败，不会静默跳过。
          AGENTFLOW_REAL_TESTS_GRANTED: "true"
          AGENTFLOW_REAL_TESTS_GRANT_REASON: ${{ needs.real-tests-gate.outputs.reason }}
        run: bash .github/scripts/run-cases.sh --kind real --artifact-dir "$TEST_ARTIFACT_ROOT/real" --parallel 1
      # 失败时保留报告与用例日志便于定位；不上传配置、私钥或数据库。
      - name: 上传真实测试产物
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/.test-artifacts/real
          if-no-files-found: warn
          retention-days: 7

  ci-summary:
    name: CI 汇总
    needs:
      - go-static
      - go-inventory
      - go-unit
      - cases-local
      - cases-e2e
      - cases-selfcheck
      - ui-test
      - real-tests-gate
      - real-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 本 Job 运行在独立 Runner 上，必须先检出仓库才能读取汇总脚本。
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 结论只来自 Job 与步骤的结构化结果（needs.*.result 与 steps.*.outcome），
      # 不对测试日志做字符串搜索冒充判定。
      - name: 汇总必需 Job 结论
        env:
          GO_STATIC_RESULT: ${{ needs.go-static.result }}
          GO_STATIC_STEP: ${{ needs.go-static.outputs.static }}
          GO_INVENTORY_RESULT: ${{ needs.go-inventory.result }}
          GO_INVENTORY_GROUPS_STEP: ${{ needs.go-inventory.outputs.groups }}
          GO_INVENTORY_AUDIT_STEP: ${{ needs.go-inventory.outputs.coverage }}
          GO_INVENTORY_PACKAGES: ${{ needs.go-inventory.outputs.package_total }}
          GO_INVENTORY_CASES: ${{ needs.go-inventory.outputs.case_total }}
          GO_GROUPS_SUMMARY: ${{ needs.go-inventory.outputs.groups_markdown }}
          GO_UNIT_RESULT: ${{ needs.go-unit.result }}
          GO_UNIT_STEP: ${{ needs.go-unit.outputs.tests }}
          CASES_LOCAL_RESULT: ${{ needs.cases-local.result }}
          CASES_LOCAL_STEP: ${{ needs.cases-local.outputs.tests }}
          CASES_E2E_RESULT: ${{ needs.cases-e2e.result }}
          CASES_E2E_STEP: ${{ needs.cases-e2e.outputs.tests }}
          CASES_SELFCHECK_RESULT: ${{ needs.cases-selfcheck.result }}
          CASES_SELFCHECK_STEP: ${{ needs.cases-selfcheck.outputs.tests }}
          UI_TEST_RESULT: ${{ needs.ui-test.result }}
          UI_TEST_PREPARE: ${{ needs.ui-test.outputs.prepare }}
          UI_TEST_STEP: ${{ needs.ui-test.outputs.tests }}
          UI_TEST_GATES: ${{ needs.ui-test.outputs.gates }}
          REAL_GATE_RESULT: ${{ needs.real-tests-gate.result }}
          REAL_GATE_MODE: ${{ needs.real-tests-gate.outputs.mode }}
          REAL_GATE_ENABLED: ${{ needs.real-tests-gate.outputs.enabled }}
          REAL_GATE_REASON: ${{ needs.real-tests-gate.outputs.reason }}
          REAL_TESTS_RESULT: ${{ needs.real-tests.result }}
        run: bash .github/scripts/summarize-ci-gate.sh
