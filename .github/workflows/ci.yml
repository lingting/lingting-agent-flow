# AgentFlow 持续集成门禁。
#
# 必需 Job（任一非成功，ci-summary 一律失败，不会把门禁报告为通过）：
# - go-static：Go 格式、静态检查与编译，最先失败以获得最快反馈
# - go-test  ：`make test` 全量测试（单元 / 本机集成 / 真实外部依赖 / CLI E2E / 打包冒烟）
# - go-race  ：竞态检测（`make test-race` 覆盖范围 + 数据库迁移 + 任务级工作流编排）
# - ui-test  ：前端单元测试、Playwright 浏览器 E2E、格式、lint、类型检查与生产构建
#
# 真实外部依赖测试（真实 SSH 设备、真实远程 Docker、容器内真实 Pi、真实远程 Git）
# 与普通 CI 分成两层，互不重叠：
# - 普通 CI 的四个必需 Job 不读取任何真实设备凭据；GitHub Actions 中没有授权标记时，
#   这些用例在读取配置、建立连接之前就输出 WARN [SKIP] 并跳过。跳过不是通过，也不会
#   让 CI 失败。
# - real-tests 只在真实测试授权判断通过后运行，且只执行需要真实外部依赖的测试包，
#   不重复执行普通 Go 测试。
#
# 真实测试授权由唯一的用户变量 AGENTFLOW_REAL_TESTS 控制（self / collaborator / all；
# 未设置、为空或取值未知时关闭）。判定规则集中在 internal/cigate，由
# cmd/agentflow-ci 执行：工作流里不写授权决策，也不在判定过程中检出或执行被提交的代码
# （判定 Job 检出的是 PR 的基础提交或本次运行的提交）。
#
# 凭据边界：真实测试的连接配置只来自 real-tests 环境的 Environment Secrets，
# 普通 CI 与授权判断 Job 都不读取 Secret；pull_request 事件不会把真实设备凭据交给
# fork PR，缺少 Secret 时 real-tests 明确报告 SKIP 而不是失败或伪造通过。
#
# 所有 Action 都用提交 SHA 固定（不用可移动的 tag），避免上游重新指向标签时 CI 行为变化。
#
# 本工作流同时提供给 publish.yml 复用（workflow_call）：正式 Release 必须以同一次运行
# 里通过的 CI 门禁为前提，而不是"标签提交早先碰巧在 master 上通过过"。workflow_call
# 不参与真实测试身份判定，因此复用运行时 real-tests 一律跳过。
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:

# 最小权限：所有 Job 只读取仓库内容，不使用 Secret、不写入仓库、不需要额外作用域。
permissions:
  contents: read

# 同一 PR 的旧运行在新提交到达后取消；push 与手动触发不取消，避免丢失主分支门禁证据。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # 测试产物根目录固定在工作区内。测试代码仍按 os.TempDir() / os.tmpdir() 生成随机工作
  # 空间，只在测试步骤里把系统临时目录指向这里，使 upload-artifact 能取到产物；
  # 依赖安装等步骤不使用该目录，避免临时目录不存在时打断安装。
  TEST_ARTIFACT_ROOT: ${{ github.workspace }}/.test-artifacts

jobs:
  go-static:
    name: Go 格式与静态检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      static: ${{ steps.static.outcome }}
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: 格式、静态检查与编译
        id: static
        run: |
          set -euo pipefail
          # make fmt-check 只打印未格式化文件且退出码为 0，这里必须以非零退出码作为门禁。
          unformatted="$(gofmt -l cmd internal tests)"
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未按 gofmt 格式化，请执行 make fmt 后重新提交"
            echo "$unformatted"
            exit 1
          fi
          go vet ./...
          go build ./...

  go-test:
    name: Go 全量测试
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      prepare: ${{ steps.prepare.outcome }}
      tests: ${{ steps.tests.outcome }}
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      # 单文件打包冒烟测试（tests/e2e/packaging）会调用 `pnpm build`，缺少 pnpm 或前端
      # 依赖时该用例自行跳过。为了让 make test 真正覆盖打包冒烟，这里安装前端依赖。
      - name: 安装 pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.24.0"
      - name: 安装 Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: lingting-agent-flow-ui/package.json
          cache: pnpm
          cache-dependency-path: lingting-agent-flow-ui/pnpm-lock.yaml
      - name: 安装前端依赖
        id: prepare
        working-directory: lingting-agent-flow-ui
        run: pnpm install --frozen-lockfile
      - name: 全量 Go 测试
        id: tests
        run: |
          set -euo pipefail
          # 测试工作空间落在 TMPDIR 之下，指向工作区内固定目录以便上传失败产物。
          mkdir -p "$TEST_ARTIFACT_ROOT/go"
          export TMPDIR="$TEST_ARTIFACT_ROOT/go"
          make test 2>&1 | tee "$TEST_ARTIFACT_ROOT/go/make-test-output.log"
      - name: 汇总外部依赖跳过原因
        if: always()
        run: |
          set -uo pipefail
          base="$TEST_ARTIFACT_ROOT/go/lingting-agent-flow-tests"
          skipped=""
          if [ -d "$base" ]; then
            skipped="$(grep -rh 'WARN \[SKIP\]' --include=test.log "$base" 2>/dev/null | sort -u || true)"
          fi
          {
            echo "### 外部依赖测试跳过情况"
            echo
            if [ -n "$skipped" ]; then
              echo '```text'
              echo "$skipped"
              echo '```'
              echo
              echo "以上用例因 CI 未提供真实 Pi / SSH / 远程 Docker 配置而跳过，不计为通过。"
            else
              echo "本次运行没有产生跳过记录。"
            fi
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
      # 只上传 test.log 与 latest-run.txt：逐用例结论、跳过原因与应用日志都在其中。
      # 不上传整个测试工作空间，避免把用例生成的临时私钥、数据库与 Session 一并带走。
      # 上传失败不得覆盖原本的测试失败结论，因此显式 continue-on-error。
      - name: 上传 Go 测试日志
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ github.workspace }}/.test-artifacts/go/make-test-output.log
            ${{ github.workspace }}/.test-artifacts/go/lingting-agent-flow-tests/**/test.log
            ${{ github.workspace }}/.test-artifacts/go/lingting-agent-flow-tests/latest-run.txt
          if-no-files-found: warn
          retention-days: 7

  go-race:
    name: Go 竞态检测
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      tests: ${{ steps.tests.outcome }}
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: 竞态检测
        id: tests
        run: |
          set -o pipefail
          mkdir -p "$TEST_ARTIFACT_ROOT/go-race"
          export TMPDIR="$TEST_ARTIFACT_ROOT/go-race"
          log="$TEST_ARTIFACT_ROOT/go-race/race-output.log"
          {
            # make test-race 已经覆盖 ./tests/unit/...（含 unit/store、unit/app、unit/httpapi、
            # unit/source/codesaver）与 ./tests/integration/local/ssh/...，因此这些范围不再
            # 重复执行；下面只补充 test-race 未包含的两个范围，实际覆盖是要求的超集。
            make test-race
            # 数据库迁移与并发访问
            go test -race -count=1 ./tests/integration/local/database/
            # 任务级工作流编排与并发隔离
            go test -race -count=1 ./tests/integration/local/workflow/
          } 2>&1 | tee "$log"
          # 管道会吃掉退出码，这里显式核对三组命令的结论。
          if grep -q '^FAIL' "$log"; then
            echo "::error::竞态检测存在失败的测试包"
            exit 1
          fi
      - name: 上传竞态检测日志
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-race-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ github.workspace }}/.test-artifacts/go-race/race-output.log
            ${{ github.workspace }}/.test-artifacts/go-race/lingting-agent-flow-tests/**/test.log
            ${{ github.workspace }}/.test-artifacts/go-race/lingting-agent-flow-tests/latest-run.txt
          if-no-files-found: warn
          retention-days: 7

  ui-test:
    name: 前端单元与浏览器测试
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: lingting-agent-flow-ui
    outputs:
      prepare: ${{ steps.prepare.outcome }}
      tests: ${{ steps.tests.outcome }}
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.24.0"
      - name: 安装 Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: lingting-agent-flow-ui/package.json
          cache: pnpm
          cache-dependency-path: lingting-agent-flow-ui/pnpm-lock.yaml
      - name: 安装前端依赖
        id: prepare
        run: pnpm install --frozen-lockfile
      - name: 安装 Chromium 与系统依赖
        run: pnpm exec playwright install --with-deps chromium
      # test:all:safe 内部固定顺序为：vitest（--maxWorkers 4）→ Playwright（--workers=4）→
      # vp fmt / vp lint --fix / tsc --noEmit → 生产构建。并发度保持项目既有设置，不提高。
      - name: 前端单元、E2E、格式、lint、类型检查与构建
        id: tests
        run: |
          set -o pipefail
          # 测试工作空间落在 TMPDIR 之下，指向工作区内固定目录以便上传失败产物。
          mkdir -p "$TEST_ARTIFACT_ROOT/ui"
          export TMPDIR="$TEST_ARTIFACT_ROOT/ui"
          pnpm test:all:safe 2>&1 | tee "$TEST_ARTIFACT_ROOT/ui/ui-test-output.log"
      # vp fmt 与 vp lint --fix 会自动修改文件且不返回失败，因此单独核验工作区是否仍有待修复
      # 改动：有改动说明提交前没跑格式化，格式检查才算真正的门禁。
      - name: 核验格式与 lint 无待修复改动
        working-directory: .
        run: |
          set -euo pipefail
          dirty="$(git -C "$GITHUB_WORKSPACE" status --porcelain -- lingting-agent-flow-ui)"
          if [ -n "$dirty" ]; then
            echo "::error::前端仍有 vp fmt / vp lint --fix 会自动修改的文件"
            echo "$dirty"
            git -C "$GITHUB_WORKSPACE" --no-pager diff -- lingting-agent-flow-ui
            exit 1
          fi
      # 前端产物只包含测试输出、Playwright HTML 报告、失败截图与 trace，不含依赖目录。
      # 上传失败不得覆盖原本的测试失败结论，因此显式 continue-on-error。
      - name: 上传前端测试产物
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/.test-artifacts/ui
          if-no-files-found: warn
          retention-days: 7

  # 真实测试授权判断：只读取仓库变量与 GitHub 事件上下文，不读取任何真实设备凭据，
  # 不建立网络连接（collaborator 模式下的 push 需要查询推送者权限，这是唯一的网络访问），
  # 也不执行被提交的代码。判定结论写入 Job 输出与摘要，供 real-tests 与 ci-summary 使用。
  real-tests-gate:
    name: 真实测试授权判断
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.gate.outputs.real_tests_enabled }}
      mode: ${{ steps.gate.outputs.mode }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      # 只检出可信提交：pull_request 事件检出基础分支提交，其他事件检出本次运行的提交。
      # 被提交的代码不参与授权判定，避免"PR 自己修改判定逻辑"绕过信任策略。
      - name: 检出可信的判定代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
      - name: 安装 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: 判定真实测试资格
        id: gate
        env:
          # 唯一的用户配置变量：GitHub Repository Variable，未设置时为关闭状态。
          AGENTFLOW_REAL_TESTS: ${{ vars.AGENTFLOW_REAL_TESTS }}
          # 身份字段全部来自 GitHub 事件上下文；不使用 commit author 姓名或邮箱。
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          # 令牌只用于查询推送者的仓库权限（collaborator 模式 + push 事件），
          # 其他判定不发起任何网络访问；查不出权限时按拒绝处理（fail closed）。
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          go run ./cmd/agentflow-ci real-tests-gate \
            -mode "$AGENTFLOW_REAL_TESTS" \
            -event "$GITHUB_EVENT_NAME" \
            -actor "$GITHUB_ACTOR" \
            -repository-owner "$REPOSITORY_OWNER" \
            -pr-author "$PR_AUTHOR" \
            -author-association "$AUTHOR_ASSOCIATION" \
            -repository "$GITHUB_REPOSITORY" \
            -api-url "$GITHUB_API_URL"

  # 真实外部依赖测试：只有授权判断通过后才运行，且只执行需要真实设备的测试包。
  #
  # 连接配置只来自 real-tests 环境的 Environment Secrets（不是全仓库可读的
  # Repository Secrets）：普通 CI 拿不到这些凭据，fork PR 也拿不到。
  # 缺少必需 Secret 时本 Job 明确报告 SKIP，未执行的用例不计为通过。
  real-tests:
    name: 真实外部依赖测试
    needs: [real-tests-gate]
    if: needs.real-tests-gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # 环境保护规则与凭据都挂在这个 Environment 上，而不是整个仓库。
    environment: real-tests
    permissions:
      contents: read
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      # 现场生成 tests/config/*.yml：这些文件被 .gitignore 忽略，不会被提交或上传。
      # 私钥与 known_hosts 写入 RUNNER_TEMP 下的临时目录，测试结束时随 Runner 销毁；
      # 配置内容与凭据值一律不打印，输出里只出现"哪些文件已生成"。
      - name: 准备真实测试配置
        id: config
        env:
          REAL_SSH_HOST: ${{ secrets.REAL_SSH_HOST }}
          REAL_SSH_USER: ${{ secrets.REAL_SSH_USER }}
          REAL_SSH_PORT: ${{ secrets.REAL_SSH_PORT }}
          REAL_SSH_PRIVATE_KEY: ${{ secrets.REAL_SSH_PRIVATE_KEY }}
          REAL_SSH_KNOWN_HOSTS: ${{ secrets.REAL_SSH_KNOWN_HOSTS }}
          REAL_DOCKER_AGENT_IMAGE: ${{ secrets.REAL_DOCKER_AGENT_IMAGE }}
          REAL_DOCKER_GIT_IMAGE: ${{ secrets.REAL_DOCKER_GIT_IMAGE }}
          REAL_DOCKER_PI_BASE_URL: ${{ secrets.REAL_DOCKER_PI_BASE_URL }}
          REAL_DOCKER_PI_API_KEY: ${{ secrets.REAL_DOCKER_PI_API_KEY }}
          REAL_DOCKER_PI_MODEL: ${{ secrets.REAL_DOCKER_PI_MODEL }}
          REAL_DOCKER_PI_THINKING_LEVEL: ${{ secrets.REAL_DOCKER_PI_THINKING_LEVEL }}
          REAL_GIT_REPOSITORY: ${{ secrets.REAL_GIT_REPOSITORY }}
          REAL_GIT_SSH_KEY: ${{ secrets.REAL_GIT_SSH_KEY }}
          # REAL_PI_MODEL 只是可选的套件参数（模型标识），不参与授权判定：
          # 真实测试的信任范围始终只由 AGENTFLOW_REAL_TESTS 决定。留空时使用免费模型 group/free。
          REAL_PI_MODEL: ${{ vars.REAL_PI_MODEL }}
        run: |
          set -euo pipefail
          # 配置生成逻辑放在仓库脚本里，便于审阅与独立校验；它只读取环境变量、
          # 只写 tests/config/*.yml 与 RUNNER_TEMP 下的临时文件。
          python3 .github/scripts/prepare-real-tests-config.py
      - name: 真实外部依赖测试
        id: real
        if: steps.config.outputs.configured == 'true'
        env:
          # 授权标记由本工作流的授权判断 Job 产生，不是第二个用户可配置开关；
          # 未设置或非 true 时测试辅助代码按未授权处理并跳过。
          AGENTFLOW_REAL_TESTS_GRANTED: "true"
          AGENTFLOW_REAL_TESTS_GRANT_REASON: ${{ needs.real-tests-gate.outputs.reason }}
        run: |
          set -o pipefail
          mkdir -p "$TEST_ARTIFACT_ROOT/real"
          export TMPDIR="$TEST_ARTIFACT_ROOT/real"
          log="$TEST_ARTIFACT_ROOT/real/real-tests-output.log"
          # 只执行需要真实外部依赖的测试包：真实 Pi CLI、真实 SSH、真实远程 Docker /
          # Agent / 代码保存 / 工作流。本机模拟测试仍由普通 CI 的 go-test 覆盖。
          go test -count=1 -v -p 4 -parallel 4 \
            ./tests/integration/pi/... \
            ./tests/integration/ssh/... \
            ./tests/integration/remote/... 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::真实外部依赖测试失败"
            exit "$status"
          fi
      # 汇总只用于展示跳过原因，退出码完全由上面的 go test 决定，不对日志做结论判断。
      - name: 汇总真实测试结论
        if: always()
        env:
          GATE_MODE: ${{ needs.real-tests-gate.outputs.mode }}
          GATE_REASON: ${{ needs.real-tests-gate.outputs.reason }}
          CONFIGURED: ${{ steps.config.outputs.configured }}
          TESTS_OUTCOME: ${{ steps.real.outcome }}
        run: |
          set -uo pipefail
          base="$TEST_ARTIFACT_ROOT/real/lingting-agent-flow-tests"
          skipped=""
          if [ -d "$base" ]; then
            skipped="$(grep -rh 'WARN \[SKIP\]' --include=test.log "$base" 2>/dev/null | sort -u || true)"
          fi
          {
            echo "### 真实外部依赖测试"
            echo
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 授权模式 | ${GATE_MODE} |"
            echo "| 测试配置 | ${CONFIGURED} |"
            echo "| 测试步骤结论 | ${TESTS_OUTCOME} |"
            echo "| 授权原因 | ${GATE_REASON} |"
            echo
            if [ "${CONFIGURED}" != "true" ]; then
              echo "本次运行没有执行真实测试：缺少真实测试配置或凭据，未执行的用例不计为通过。"
            elif [ -n "$skipped" ]; then
              echo '```text'
              echo "$skipped"
              echo '```'
              echo
              echo "以上用例按套件配置跳过（目标或镜像未启用、本机/容器内缺少 CLI），不计为通过。"
            else
              echo "本次运行没有产生跳过记录。"
            fi
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
      # 失败时保留日志便于定位；只上传日志，不上传配置、私钥或数据库。
      - name: 上传真实测试日志
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ github.workspace }}/.test-artifacts/real/real-tests-output.log
            ${{ github.workspace }}/.test-artifacts/real/lingting-agent-flow-tests/**/test.log
            ${{ github.workspace }}/.test-artifacts/real/lingting-agent-flow-tests/latest-run.txt
          if-no-files-found: warn
          retention-days: 7

  ci-summary:
    name: CI 汇总
    needs: [go-static, go-test, go-race, ui-test, real-tests-gate, real-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 结论只来自 Job 与步骤的结构化结果（needs.*.result 与 steps.*.outcome），
      # 不对测试日志做字符串搜索冒充判定。
      - name: 汇总必需 Job 结论
        env:
          GO_STATIC_RESULT: ${{ needs.go-static.result }}
          GO_STATIC_STEP: ${{ needs.go-static.outputs.static }}
          GO_TEST_RESULT: ${{ needs.go-test.result }}
          GO_TEST_PREPARE: ${{ needs.go-test.outputs.prepare }}
          GO_TEST_STEP: ${{ needs.go-test.outputs.tests }}
          GO_RACE_RESULT: ${{ needs.go-race.result }}
          GO_RACE_STEP: ${{ needs.go-race.outputs.tests }}
          UI_TEST_RESULT: ${{ needs.ui-test.result }}
          UI_TEST_PREPARE: ${{ needs.ui-test.outputs.prepare }}
          UI_TEST_STEP: ${{ needs.ui-test.outputs.tests }}
          REAL_GATE_RESULT: ${{ needs.real-tests-gate.result }}
          REAL_GATE_MODE: ${{ needs.real-tests-gate.outputs.mode }}
          REAL_GATE_ENABLED: ${{ needs.real-tests-gate.outputs.enabled }}
          REAL_GATE_REASON: ${{ needs.real-tests-gate.outputs.reason }}
          REAL_TESTS_RESULT: ${{ needs.real-tests.result }}
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/ci-summary.md"
          {
            echo "## CI 门禁结论"
            echo
            echo "| Job | Job 结论 | 汇总判定 |"
            echo "| --- | --- | --- |"
          } > "$report"
          failed=0
          # 逐行处理必需 Job：每行格式为 Job 名|Job 结论|测试步骤结论|环境准备步骤结论。
          # 这里用数组而不是 here-document：YAML 块标量的内容自带缩进，缩进的结束标记
          # 不会被 bash 识别为 heredoc 终止行，会让整段脚本被当成数据吞掉。
          for row in \
            "go-static|${GO_STATIC_RESULT}|${GO_STATIC_STEP}|-" \
            "go-test|${GO_TEST_RESULT}|${GO_TEST_STEP}|${GO_TEST_PREPARE}" \
            "go-race|${GO_RACE_RESULT}|${GO_RACE_STEP}|-" \
            "ui-test|${UI_TEST_RESULT}|${UI_TEST_STEP}|${UI_TEST_PREPARE}"; do
            IFS='|' read -r job result tests prepare <<< "$row"
            [ -z "$job" ] && continue
            case "$result" in
              success)
                verdict="成功"
                ;;
              failure)
                if [ "$tests" = "failure" ]; then
                  verdict="失败：测试步骤失败"
                elif [ "$prepare" = "failure" ]; then
                  verdict="失败：环境准备失败，测试未执行"
                elif [ "$tests" = "skipped" ] || [ -z "$tests" ]; then
                  verdict="失败：测试步骤未执行"
                else
                  verdict="失败：测试之外的步骤失败"
                fi
                failed=1
                ;;
              cancelled)
                verdict="未完成：运行被取消"
                failed=1
                ;;
              skipped)
                verdict="未执行：Job 被跳过，不计为通过"
                failed=1
                ;;
              *)
                verdict="未执行：缺少 Job 结论，不计为通过"
                failed=1
                ;;
            esac
            echo "| ${job} | ${result:-（空）} | ${verdict} |" >> "$report"
          done
          # 授权判断 Job 必须成功：它失败说明判定本身没跑完，不能当成"未授权"放行。
          case "$REAL_GATE_RESULT" in
            success)
              gate_verdict="成功（判定已完成）"
              ;;
            *)
              gate_verdict="失败：授权判定未完成"
              failed=1
              ;;
          esac
          echo "| real-tests-gate | ${REAL_GATE_RESULT:-（空）} | ${gate_verdict} |" >> "$report"
          # 真实测试 Job：未获授权时被跳过是预期状态，不计为通过，但不算失败；
          # 实际执行后失败必须让门禁失败，不得把真实测试失败报告为通过。
          case "$REAL_TESTS_RESULT" in
            success)
              real_verdict="已执行：结论见该 Job 摘要"
              ;;
            skipped)
              real_verdict="未执行：未获授权或本次事件不参与判定，不计为通过"
              ;;
            failure)
              real_verdict="失败：真实外部依赖测试未通过"
              failed=1
              ;;
            cancelled)
              real_verdict="未完成：运行被取消"
              failed=1
              ;;
            *)
              real_verdict="未执行：缺少 Job 结论，不计为通过"
              failed=1
              ;;
          esac
          echo "| real-tests | ${REAL_TESTS_RESULT:-（空）} | ${real_verdict} |" >> "$report"
          {
            echo
            echo "真实测试授权：模式 \`${REAL_GATE_MODE:-（空）}\`，结论 enabled=${REAL_GATE_ENABLED:-false}。"
            echo "判定原因：${REAL_GATE_REASON:-（空）}。"
            echo
            echo "外部依赖用例（真实 Pi / SSH / 远程 Docker）在未获授权时输出 WARN \[SKIP\] 并跳过；"
            echo "跳过与未执行都不计为通过，跳过原因见对应 Job 产物中的 test.log。"
          } >> "$report"
          cat "$report"
          cat "$report" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          if [ "$failed" -ne 0 ]; then
            echo "::error::CI 门禁未通过：存在非成功的必需 Job 或真实测试执行失败"
            exit 1
          fi
          echo "全部必需 Job 通过；真实测试未执行时已标注不计为通过。"
