# AgentFlow 正式发布制品构建（可被 publish.yml 复用）。
#
# 本工作流只负责"构建与制品准备"：
#   - 由 publish.yml 复用（workflow_call），或手动触发做一次构建预演（workflow_dispatch）；
#   - 生成经过校验的跨平台压缩包、SHA256SUMS 与 release-manifest.json；
#   - 把制品上传到本次 Actions 运行的制品区；
#   - 不创建 GitHub Release、不推送镜像、不部署环境、不写入仓库。
#
# 版本标签推送不再直接触发本工作流：标签发布统一走 publish.yml，由它先跑 CI 门禁再
# 复用本工作流构建，避免同一个标签被构建两次、也避免"两次构建产出不同制品"。
#
# 制品构建本身复用仓库唯一的发布入口 `make release-dist`（内部调用
# cmd/agentflow-release），不在工作流里复制一套可能不一致的编译命令。
#
# 运行冒烟在目标平台的原生 Runner 上执行。若某个平台的 Runner 标签在目标仓库不可用，
# 对应的冒烟 Job 会明确失败，而不是静默跳过：平台要么被真实验证，要么在 docs/release.md
# 中标注为"仅交叉编译成功、运行验证未执行"。
#
# 具体执行逻辑在 .github/scripts/ 下（版本解析、制品构建、制品核验、结论汇总），
# 本文件只声明 Job、依赖、矩阵与脚本调用。
name: Release

on:
  workflow_call:
    inputs:
      version:
        description: "版本号 vMAJOR.MINOR.PATCH；由调用方从标签解析后传入"
        required: true
        type: string
    outputs:
      version:
        description: "本次构建的版本号"
        value: ${{ jobs.resolve.outputs.version }}
      commit:
        description: "本次构建使用的完整提交 SHA"
        value: ${{ jobs.resolve.outputs.commit }}
      artifact_name:
        description: "Actions 制品名称，调用方据此下载制品"
        value: ${{ jobs.resolve.outputs.artifact_name }}
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 vMAJOR.MINOR.PATCH；留空时要求当前 ref 是版本标签"
        required: false
        default: ""
        type: string

# 最小权限：只读取仓库内容，不使用 Secret，也不写入仓库。
# 发布权限只授予 publish.yml 中实际创建 Release 的 Job。
permissions:
  contents: read

# 发布构建不能被取消：中途取消会留下半套制品，容易与旧版本的制品混淆。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_DIR: dist/release
  # 前端与发布构建所需的固定版本（与 ci.yml 保持一致）。
  PNPM_VERSION: "11.24.0"

jobs:
  resolve:
    name: 解析版本元数据
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      commit: ${{ steps.resolve.outputs.commit }}
      artifact_name: ${{ steps.resolve.outputs.artifact_name }}
    steps:
      # 版本解析逻辑在 .github/scripts 里，因此这一步需要先检出代码；检出只读取源码，
      # 不会在版本不合格之前开始构建。
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 解析版本号与提交号
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          COMMIT_SHA: ${{ github.sha }}
        run: bash .github/scripts/resolve-release-version.sh --input-version "$INPUT_VERSION"

  build:
    name: 构建发布制品
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 标签推送时检出标签指向的提交；手动触发时检出当前 ref。
          persist-credentials: false
      - name: 安装 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: 安装 pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: 安装 Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: lingting-agent-flow-ui/package.json
          cache: pnpm
          cache-dependency-path: lingting-agent-flow-ui/pnpm-lock.yaml
      - name: 按锁文件安装前端依赖
        working-directory: lingting-agent-flow-ui
        run: pnpm install --frozen-lockfile
      # make release-dist 的顺序是：前端生产构建 → 校验入口 HTML/JS/CSS → 逐平台交叉编译
      # → 打包 → 写 SHA256SUMS 与 release-manifest.json → 回读自检。顺序由 Makefile 保证，
      # 不允许先编译 Go 再构建前端。
      #
      # 这里同时把"实际用于构建的环境"写进制品元数据：Go/Node/pnpm 版本、仓库、工作流、
      # 运行标识。缺少这些信息时正式版本的构建会直接失败，而不是产出无法溯源的制品。
      - name: 构建并打包发布制品
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          bash .github/scripts/build-release-dist.sh \
            --version "${{ needs.resolve.outputs.version }}" \
            --dir "${{ env.RELEASE_DIR }}" \
            --attestation-provider "github-artifact-attestation"
      # 独立复核：一次核验完成摘要、版本、提交、平台覆盖与"目录里没有多余文件"，
      # 而不是只看构建工具的退出码；发布工作流会把这份结论当作上传依据。
      - name: 校验制品与校验文件一致
        run: |
          bash .github/scripts/verify-release-assets.sh \
            --dir "${{ env.RELEASE_DIR }}" \
            --version "${{ needs.resolve.outputs.version }}" \
            --commit "${{ needs.resolve.outputs.commit }}"
      - name: 输出发布清单摘要
        # 摘要生成逻辑在 .github/scripts/release-artifacts-summary.py：它只读取清单声明的
        # 制品名称、大小与 SHA-256，并直接追加到 Job 摘要，不打印仓库路径或环境变量。
        run: python3 .github/scripts/release-artifacts-summary.py "${{ env.RELEASE_DIR }}"
      # 上传失败必须让 Job 失败，不能"显示成功后遗漏制品"。
      - name: 上传发布制品
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.resolve.outputs.artifact_name }}
          path: |
            ${{ env.RELEASE_DIR }}/*.tar.gz
            ${{ env.RELEASE_DIR }}/*.zip
            ${{ env.RELEASE_DIR }}/SHA256SUMS
            ${{ env.RELEASE_DIR }}/release-manifest.json
          if-no-files-found: error
          retention-days: 30

  smoke:
    name: 运行冒烟（${{ matrix.os }}/${{ matrix.arch }}）
    needs: [resolve, build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      # 一个平台的冒烟失败不应该掩盖其他平台的结论，全部跑完再汇总。
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            archive_suffix: tar.gz
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            archive_suffix: tar.gz
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: amd64
            archive_suffix: tar.gz
            runner: macos-13
          - os: darwin
            arch: arm64
            archive_suffix: tar.gz
            runner: macos-14
          - os: windows
            arch: amd64
            archive_suffix: zip
            runner: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: 下载发布制品
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.resolve.outputs.artifact_name }}
          path: ${{ github.workspace }}/.release-artifacts
      # 冒烟测试本体是仓库内的 Go 用例：它独立解压制品、校验布局与 version.json、
      # 执行版本查询，再从解压目录启动程序核验 HTTP API 与前端静态资源。
      - name: 运行制品冒烟
        env:
          AGENTFLOW_RELEASE_ARCHIVE: ${{ github.workspace }}/.release-artifacts/agentflow_${{ needs.resolve.outputs.version }}_${{ matrix.os }}_${{ matrix.arch }}.${{ matrix.archive_suffix }}
          AGENTFLOW_RELEASE_PLATFORM: ${{ matrix.os }}/${{ matrix.arch }}
          AGENTFLOW_RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          AGENTFLOW_RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: go test -count=1 -v -run TestReleaseArchiveSmoke ./tests/e2e/packaging/...

  release-summary:
    name: 发布汇总
    needs: [resolve, build, smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 结论只来自结构化结果，不对日志做字符串搜索冒充判定。
      - name: 汇总发布构建结论
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          COMMIT: ${{ needs.resolve.outputs.commit }}
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
        run: |
          bash .github/scripts/summarize-release-stages.sh \
            --title "发布构建结论" \
            --stage "版本解析=$RESOLVE_RESULT" \
            --stage "制品构建与上传=$BUILD_RESULT" \
            --stage "目标平台运行冒烟=$SMOKE_RESULT" \
            --version "$VERSION" \
            --commit "$COMMIT" \
            --note "本工作流只上传 Actions 运行制品，不创建 GitHub Release、不推送镜像、不部署环境。" \
            --note "正式 Release 由 .github/workflows/publish.yml 在 CI 门禁与全部冒烟通过后创建。"
